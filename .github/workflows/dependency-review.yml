name: Dependency review

# On every pull request: blocks a change that adds or upgrades to a library with a known serious
# vulnerability, and shows licence changes. Needs no secrets.
on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Needs "Dependency graph" switched on in the repository's Settings > Code security. Until then this
      # reports its own failure but must not make every pull request look broken.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
