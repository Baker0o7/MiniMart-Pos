name: CI – Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (financial logic)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Fails if the committed Gradle wrapper jar is not an official Gradle release.
      - uses: gradle/actions/wrapper-validation@v4

      - name: Release checks
        run: bash scripts/release-checks.sh

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Runs every module's tests: pure-JVM :core, the Room DAOs in :data and the app logic in :app.
      - name: Run unit tests
        run: |
          set -o pipefail
          gradle :core:test testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      # Timings of the large-database tests (data/build/perf-report.txt) on the run summary, so a slow creep shows.
      - name: Performance report
        if: always()
        run: |
          if [ -f data/build/perf-report.txt ]; then
            { echo "### Large-data timings (CI machine, not a phone)"; cat data/build/perf-report.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Lint errors fail the build. (Warnings are reported in the uploaded report but do not fail it.)
      - name: Lint
        run: |
          set -o pipefail
          gradle :data:lintDebug :app:lintDebug --no-daemon --stacktrace 2>&1 | tee lint.log

      # The Compose UI tests need an emulator to run (see instrumented.yml); here we make sure they still build.
      - name: Compile instrumented tests
        run: |
          set -o pipefail
          gradle :app:assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee androidtest.log

      - name: Surface build errors as annotations
        if: failure()
        run: |
          # Lint's console output names only the first error, so read every error out of the XML reports.
          # GitHub caps annotations at ten per step, so they go into a single annotation.
          msg=$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          out = []
          for f in glob.glob("*/build/reports/lint-results-debug.xml"):
              for i in ET.parse(f).getroot().iter("issue"):
                  if i.get("severity") in ("Error", "Fatal"):
                      loc = i.find("location")
                      where = (loc.get("file", "").split("MiniMart-Pos/MiniMart-Pos/")[-1] + ":" + loc.get("line", "?")) if loc is not None else "?"
                      out.append(f"{where} [{i.get('id')}] {i.get('message')[:160]}")
          print(" | ".join(sorted(set(out)))[:12000])
          PY
          )
          [ -n "$msg" ] && echo "::error title=Lint errors::${msg}"
          # Gradle's "What went wrong" block in full (long lists such as AAR-metadata problems are cut off otherwise).
          python3 - <<'PY'
          import glob
          for f in ("build.log", "lint.log", "androidtest.log"):
              try: lines = open(f, errors="replace").read().splitlines()
              except OSError: continue
              for i, l in enumerate(lines):
                  if l.startswith("* What went wrong"):
                      block = [x.rstrip() for x in lines[i + 1:i + 90] if not x.startswith("* Try")]
                      body = "%0A".join(block).replace("\r", "")
                      print(f"::error title=Gradle ({f})::{body}")
                      break
          PY
          # The REST API can't return raw job logs, so echo compiler/Gradle errors as annotations.
          grep -E "^e: |^w: .*Unresolved|error:|What went wrong|Execution failed|Could not|FAILED|Caused by" -A2 build.log lint.log androidtest.log 2>/dev/null \
            | head -60 | while IFS= read -r line; do echo "::error::${line}"; done

      # A one-line count of lint warnings by kind, so they stay visible without opening the report.
      - name: Lint summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, collections, xml.etree.ElementTree as ET
          c = collections.Counter(); where = collections.defaultdict(list)
          for f in glob.glob("*/build/reports/lint-results-debug.xml"):
              for i in ET.parse(f).getroot().iter("issue"):
                  if i.get("severity") == "Warning":
                      c[i.get("id")] += 1
                      loc = i.find("location")
                      if loc is not None and len(where[i.get("id")]) < 3:
                          where[i.get("id")].append(loc.get("file", "").split("MiniMart-Pos/MiniMart-Pos/")[-1].split("/")[-1] + ":" + loc.get("line", "?"))
          if c:
              print("::notice title=Lint warnings::" + " | ".join(f"{k} x{v} ({', '.join(where[k])})" for k, v in c.most_common(25)))
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            data/build/reports/tests/testDebugUnitTest/
            core/build/reports/tests/test/
            */build/reports/lint-results-debug.*
          retention-days: 14
