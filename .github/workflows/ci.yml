name: CI – Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (financial logic)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Release checks
        run: bash scripts/release-checks.sh

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Runs every module's tests: the financial logic in :app/:core and the Room DAOs in :data.
      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      # Lint errors fail the build. (Warnings are reported in the uploaded report but do not fail it.)
      - name: Lint
        run: |
          set -o pipefail
          gradle :core:lintDebug :data:lintDebug :app:lintDebug --no-daemon --stacktrace 2>&1 | tee lint.log

      - name: Surface build errors as annotations
        if: failure()
        run: |
          if [ -f lint.log ]; then
            # GitHub caps annotations at ten per step, so join every lint error into a single one.
            msg=$(grep -E "^/.*: Error: " lint.log | sed 's#.*/MiniMart-Pos/MiniMart-Pos/##' | sort -u | tr '\n' '|' | cut -c1-12000)
            [ -n "$msg" ] && echo "::error title=Lint errors::${msg}"
          fi
          # The REST API can't return raw job logs, so echo compiler/Gradle errors as annotations.
          grep -E "^e: |^w: .*Unresolved|error:|What went wrong|Execution failed|Could not|FAILED|Caused by" -A2 build.log \
            | head -60 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            data/build/reports/tests/testDebugUnitTest/
            core/build/reports/tests/testDebugUnitTest/
            */build/reports/lint-results-debug.*
          retention-days: 14
