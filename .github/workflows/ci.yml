name: CI – Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (financial logic)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Release checks
        run: bash scripts/release-checks.sh

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Runs every module's tests: the financial logic in :app/:core and the Room DAOs in :data.
      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      # Lint errors fail the build. (Warnings are reported in the uploaded report but do not fail it.)
      - name: Lint
        run: |
          set -o pipefail
          gradle :core:lintDebug :data:lintDebug :app:lintDebug --no-daemon --stacktrace 2>&1 | tee lint.log

      - name: Surface build errors as annotations
        if: failure()
        run: |
          # Lint's console output names only the first error, so read every error out of the XML reports.
          # GitHub caps annotations at ten per step, so they go into a single annotation.
          msg=$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          out = []
          for f in glob.glob("*/build/reports/lint-results-debug.xml"):
              for i in ET.parse(f).getroot().iter("issue"):
                  if i.get("severity") in ("Error", "Fatal"):
                      loc = i.find("location")
                      where = (loc.get("file", "").split("MiniMart-Pos/MiniMart-Pos/")[-1] + ":" + loc.get("line", "?")) if loc is not None else "?"
                      out.append(f"{where} [{i.get('id')}] {i.get('message')[:160]}")
          print(" | ".join(sorted(set(out)))[:12000])
          PY
          )
          [ -n "$msg" ] && echo "::error title=Lint errors::${msg}"
          # The REST API can't return raw job logs, so echo compiler/Gradle errors as annotations.
          grep -E "^e: |^w: .*Unresolved|error:|What went wrong|Execution failed|Could not|FAILED|Caused by" -A2 build.log \
            | head -60 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            data/build/reports/tests/testDebugUnitTest/
            core/build/reports/tests/testDebugUnitTest/
            */build/reports/lint-results-debug.*
          retention-days: 14
