name: UI tests (emulator)

# Runs the Compose UI tests in app/src/androidTest on an Android emulator. Emulator runs are slow and
# can be flaky, so this does not gate every push: run it by hand, or let the weekly schedule do it.
# CI.yml still compiles these tests on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Show what the emulator tests did
        if: always()
        run: |
          shopt -s globstar nullglob
          files=(app/build/outputs/androidTest-results/**/*.xml)
          echo "Result files: ${#files[@]}"
          [ ${#files[@]} -gt 0 ] || { echo "::error::No emulator test results were produced"; exit 1; }
          for f in "${files[@]}"; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          print(f"::notice::{r.get('name')}: {r.get('tests')} tests, {r.get('failures')} failures, {r.get('errors')} errors, {r.get('skipped')} skipped")
          for c in r.iter('testcase'):
              state = 'FAILED' if (c.find('failure') is not None or c.find('error') is not None) else 'passed'
              print(f"::notice::  {c.get('classname','').split('.')[-1]}.{c.get('name')}: {state}")
          PY
          done

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/
