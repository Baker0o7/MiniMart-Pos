name: UI tests (emulator)

# Runs the Compose UI tests in app/src/androidTest on an Android emulator. Emulator runs are slow and
# can be flaky, so this does not gate every push: run it by hand, or let the weekly schedule do it.
# CI.yml still compiles these tests on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle :app:installDebug :app:installDebugAndroidTest --no-daemon --stacktrace
            adb shell pm list instrumentation | tee instr.txt
            runner=$(sed -n 's/^instrumentation:\([^ ]*\) .*/\1/p' instr.txt | head -1)
            echo "runner=$runner"
            adb shell am instrument -w -r "$runner" > instrument-output.txt 2>&1 || true
            grep -E "INSTRUMENTATION_STATUS: (test|class|numtests|stack)=|INSTRUMENTATION_STATUS_CODE|^OK|FAILURES|Tests run|INSTRUMENTATION_RESULT|shortMsg|Error" instrument-output.txt | head -150 | while IFS= read -r line; do echo "::notice::$line"; done
            grep -q "INSTRUMENTATION_STATUS_CODE: -" instrument-output.txt && { echo "::error::an emulator test failed"; exit 1; } || true
            grep -q "^OK (" instrument-output.txt || { echo "::error::emulator tests did not report OK"; exit 1; }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/
