name: MiniMart POS – Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      allow_temporary_key:
        description: 'Sign with a throwaway key (phones with an earlier release must uninstall first). Only if you accept that.'
        type: boolean
        default: false

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.6.0'

jobs:
  release:
    name: Release Signed APK + AAB
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests (gate the release)
        run: gradle testDebugUnitTest --no-daemon

      # The same keystore every release, so each APK can update the one already on a shop's phone.
      # There is deliberately no silent fallback: without the secrets the release stops here, unless
      # whoever starts the run explicitly ticks "allow_temporary_key".
      - name: Restore release keystore
        if: ${{ inputs.allow_temporary_key != true }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for v in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository secret $v is not set. See docs/RELEASE_SIGNING.md."; exit 1
            fi
          done
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/minimart-release.jks
          keytool -list -keystore app/minimart-release.jks -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null
          {
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate temporary keystore (explicitly requested)
        if: ${{ inputs.allow_temporary_key == true }}
        run: |
          echo "::warning::Signing with a THROWAWAY key. Phones with an earlier release must uninstall before installing this one."
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore app/minimart-release.jks -alias minimart \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=MiniMart POS,OU=Mobile,O=MiniMart,L=Mombasa,ST=Coast,C=KE"
          {
            echo "SIGNING_STORE_PASSWORD=$PASS"
            echo "SIGNING_KEY_ALIAS=minimart"
            echo "SIGNING_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      # The bundle first and without per-ABI APKs (AGP 9 refuses to build both in one go), then the APKs.
      - name: Build signed release AAB
        run: gradle bundleRelease -PabiSplits=false --no-daemon

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VER=$(grep -E '^\s+versionName\s*=' app/build.gradle.kts | grep -oP '"\K[^"]+')
            echo "VERSION=v${VER}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "MiniMart POS ${{ steps.version.outputs.VERSION }}"
          body: |
            ## MiniMart POS ${{ steps.version.outputs.VERSION }}
            - `app-universal-release.apk` works on every phone and tablet (pick this one if unsure)
            - Smaller per-chip APKs: `arm64-v8a` (most phones from 2017 on), `armeabi-v7a` (older 32-bit phones), `x86_64` (emulators)
            - AAB for Google Play
            Default login: username `admin` | PIN `1234`
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f app/minimart-release.jks
