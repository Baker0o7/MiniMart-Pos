version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies]
    commit-message: { prefix: "ci" }

  - package-ecosystem: gradle
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: { prefix: "deps" }
    # One pull request per family instead of one per library, so a month of updates is a few reviews.
    groups:
      androidx:
        patterns: ["androidx.*"]
        update-types: [minor, patch]
      kotlinx:
        patterns: ["org.jetbrains.kotlinx*"]
        update-types: [minor, patch]
      testing:
        patterns: ["junit*", "org.robolectric*", "io.mockk*"]
    ignore:
      # The Kotlin compiler, KSP and the Compose compiler must move together and need a manual check.
      # Do those by hand (docs/DEPENDENCIES.md); patch releases still arrive.
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
