org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=false

kotlin.code.style=official

# Build performance
org.gradle.configuration-cache=false
kotlin.incremental=true

# AGP 9 switches to built-in Kotlin and a new DSL by default. Keep the plugins and DSL this project is written
# against until each module is migrated on purpose (see docs/DEPENDENCIES.md).
android.builtInKotlin=false
android.newDsl=false
